[package]
name = "progit"
version = "0.1.0"
edition = "2021"
description = "A lightweight CLI personal engineering journal"
authors = ["asim"]

[[bin]]
name = "progit"
path = "src/main.rs"

[dependencies]
clap        = { version = "4", features = ["derive"] }
sqlx        = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono"] }
tokio       = { version = "1", features = ["full"] }
chrono      = { version = "0.4", features = ["serde"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
comfy-table = "7"
owo-colors  = "4"
dirs        = "5"
anyhow      = "1"
